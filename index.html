<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Smart Escape</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14L16 30 4 23V9z' fill='%232dd4bf'/%3E%3Cpath d='M10 16h11m-4-4 4 4-4 4' stroke='%2306121f' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26">
              <path d="M16 2 28 9v14L16 30 4 23V9z" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M10 16h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title" id="app-title"></span>
            <span class="brand-sub" id="app-subtitle"></span>
          </span>
        </div>

        <div class="topbar-actions">
          <div class="lang-switch" id="lang-switch" role="group"></div>
          <button type="button" class="btn btn-primary" id="btn-import"></button>
          <input type="file" id="file-input" accept=".json,application/json" hidden />
          <button type="button" class="btn" id="btn-sample"></button>
          <button type="button" class="btn" id="btn-reset"></button>
        </div>
      </div>
    </header>

    <main class="app">
      <section class="card map-card" aria-labelledby="building-name">
        <div class="card-head">
          <h2 class="building-name" id="building-name"></h2>
          <div class="segmented" id="mode-switch" role="group"></div>
        </div>
        <div class="map-wrap" id="map-wrap">
          <svg id="map" role="group"></svg>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
      </section>

      <aside class="panel" id="panel" aria-live="polite"></aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
